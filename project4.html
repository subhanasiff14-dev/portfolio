<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon & Sun Animation</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        .container{
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background-image: url('./Imges/starry-sky-clouds-blue-sky-night-3440x1440-1094.jpg');
            background-size: cover;
            background-position: center;
            transition: 2s ease;
        }
        .day-overlay{ 
            width: 100%;
            height: 100%;
            background: linear-gradient(
            to bottom,
            rgba(135,206,235,0.8),
            rgba(255,255,255,0.3));
            opacity:0;
            transition: 2s ease;
        }
        .container:hover .day-overlay{
            opacity: 1;
        }
        .moon{
            position: absolute;
            top: 12%;
            left: 65%;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            box-shadow: 20px 20px #f5f5dc;
            transform: rotate(-25deg);
            transition: 2s ease;
        }
        .container:hover .moon{
            top: -25%;
            opacity: 0;
            transform: rotate(280deg);
        }
        .sun{
            position: absolute;
            top: 18%;
            left: 65%;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #FFD700;
            box-shadow:
            0 0 30px #FFD700,
            0 0 60px #FFD700,
            0 0 100px #FFD700;
            opacity: 0;
            transform: scale(0.5);
            transition: 2s ease;
        }
        .container:hover .sun{
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="day-overlay"></div>
        <div class="moon"></div>
        <div class="sun"></div>
    </div>
</body>
</html>
